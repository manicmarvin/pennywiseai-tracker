name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

defaults:
  run:
    shell: bash

jobs:
  parser-tests:
    name: Parser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - uses: android-actions/setup-android@v3
      with:
        # The action's default list includes the retired 'tools' package, which
        # sdkmanager now rejects (exit 1). Everything else is fetched by Gradle.
        packages: platform-tools

    - uses: gradle/actions/setup-gradle@v4

    - name: Run parser-core tests
      run: ./gradlew :parser-core:test --continue

    - name: Upload parser test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: parser-test-results
        path: parser-core/build/test-results/test/
        retention-days: 7

  app-compile:
    name: App Compile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - uses: android-actions/setup-android@v3
      with:
        # The action's default list includes the retired 'tools' package, which
        # sdkmanager now rejects (exit 1). Everything else is fetched by Gradle.
        packages: platform-tools

    - uses: gradle/actions/setup-gradle@v4

    - name: Compile standard debug app
      run: ./gradlew :app:compileStandardDebugKotlin --build-cache

    - name: Restore fixed debug keystore (personal fork)
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
        fi

    - name: Build debug APK
      run: ./gradlew :app:assembleDebug --build-cache

    - name: Upload standard debug APK
      uses: actions/upload-artifact@v4
      with:
        name: standard-debug-apk
        path: app/build/outputs/apk/standard/debug/*.apk
        retention-days: 7

    - name: Upload fdroid debug APK
      uses: actions/upload-artifact@v4
      with:
        name: fdroid-debug-apk
        path: app/build/outputs/apk/fdroid/debug/*.apk
        retention-days: 7

    - name: Upload compile report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: compile-report
        path: app/build/reports/
        retention-days: 7

  app-unit-tests:
    name: App Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - uses: android-actions/setup-android@v3
      with:
        # The action's default list includes the retired 'tools' package, which
        # sdkmanager now rejects (exit 1). Everything else is fetched by Gradle.
        packages: platform-tools

    - uses: gradle/actions/setup-gradle@v4

    - name: Run standard debug unit tests
      run: ./gradlew :app:testStandardDebugUnitTest --build-cache --continue

    - name: Report failing tests as annotations (personal fork)
      if: failure()
      run: |
        python3 - <<'PY'
        import glob, xml.etree.ElementTree as ET
        for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
            for tc in ET.parse(f).getroot().iter('testcase'):
                for bad in list(tc.findall('failure')) + list(tc.findall('error')):
                    msg = (bad.get('message') or bad.text or '').replace('\n', ' ')[:400]
                    print(f"::error title={tc.get('classname')}::{tc.get('name')}: {msg}")
        PY

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-test-results
        path: app/build/test-results/
        retention-days: 7